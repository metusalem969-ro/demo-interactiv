<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exemplu Web — Demo cap-coadă</title>
  <link rel="canonical" href="https://metusalem969-ro.github.io/exemplu-web/">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f1419;
      --card: #1a2332;
      --text: #e8eef7;
      --muted: #8b9cb3;
      --accent: #3b82f6;
      --accent-glow: rgba(59, 130, 246, 0.35);
    }

    body.theme-verde { --accent: #22c55e; --accent-glow: rgba(34, 197, 94, 0.35); }
    body.theme-portocaliu { --accent: #f97316; --accent-glow: rgba(249, 115, 22, 0.35); }
    body.theme-violet { --accent: #a855f7; --accent-glow: rgba(168, 85, 247, 0.35); }

    html, body {
      min-height: 100%;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: radial-gradient(ellipse 100% 80% at 50% 0%, #1e293b 0%, var(--bg) 55%);
      color: var(--text);
    }

    .wrap {
      max-width: 520px;
      margin: 0 auto;
      padding: 2.5rem 1.25rem 3rem;
      display: flex;
      flex-direction: column;
      gap: 1.75rem;
      align-items: center;
      text-align: center;
    }

    .badge {
      font-size: 0.75rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--accent);
      border: 1px solid var(--accent);
      padding: 0.35rem 0.85rem;
      border-radius: 999px;
      background: color-mix(in srgb, var(--accent) 12%, transparent);
    }

    h1 {
      font-size: clamp(1.75rem, 5vw, 2.25rem);
      font-weight: 700;
      line-height: 1.2;
    }

    .lead {
      color: var(--muted);
      font-size: 1.05rem;
      line-height: 1.55;
      max-width: 38ch;
    }

    .card {
      width: 100%;
      background: var(--card);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 1.25rem;
      padding: 1.75rem;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.35);
    }

    .counter {
      font-size: 3.5rem;
      font-weight: 800;
      color: var(--accent);
      text-shadow: 0 0 32px var(--accent-glow);
      line-height: 1;
      margin-bottom: 0.25rem;
    }

    .counter-label {
      font-size: 0.9rem;
      color: var(--muted);
      margin-bottom: 1.25rem;
    }

    .themes {
      display: flex;
      gap: 0.5rem;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 1.25rem;
    }

    .themes button {
      width: 2.25rem;
      height: 2.25rem;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.2);
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.2s ease;
    }

    .themes button:hover { transform: scale(1.08); }
    .themes button[aria-pressed="true"] {
      box-shadow: 0 0 0 3px var(--bg), 0 0 0 5px var(--accent);
    }

    .btn-albastru { background: #3b82f6; }
    .btn-verde { background: #22c55e; }
    .btn-portocaliu { background: #f97316; }
    .btn-violet { background: #a855f7; }

    button.action {
      font: inherit;
      font-size: 1rem;
      padding: 0.85rem 2rem;
      border: none;
      border-radius: 999px;
      cursor: pointer;
      background: var(--accent);
      color: #fff;
      box-shadow: 0 6px 24px var(--accent-glow);
      transition: transform 0.15s ease, filter 0.2s ease;
    }

    button.action:hover { filter: brightness(1.08); }
    button.action:active { transform: scale(0.97); }

    .links {
      font-size: 0.85rem;
      color: var(--muted);
      line-height: 1.8;
    }

    .links a {
      color: var(--accent);
      text-decoration: none;
    }

    .links a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <main class="wrap">
    <span class="badge">Repo exemplu</span>
    <h1>Pagină web de la zero</h1>
    <p class="lead">
      Demo cap-coadă: repository pe GitHub și GitLab, același cod,
      publicat pe ambele platforme cu Pages.
    </p>

    <section class="card" aria-labelledby="counter-title">
      <p class="counter" id="count" aria-live="polite">0</p>
      <p class="counter-label" id="counter-title">Apăsări pe buton</p>

      <div class="themes" role="group" aria-label="Temă culoare">
        <button type="button" class="btn-albastru" data-theme="" aria-pressed="true" title="Albastru"></button>
        <button type="button" class="btn-verde" data-theme="verde" aria-pressed="false" title="Verde"></button>
        <button type="button" class="btn-portocaliu" data-theme="portocaliu" aria-pressed="false" title="Portocaliu"></button>
        <button type="button" class="btn-violet" data-theme="violet" aria-pressed="false" title="Violet"></button>
      </div>

      <button type="button" class="action" id="btn-click">Apasă aici</button>
    </section>

    <p class="links">
      GitHub:
      <a href="https://github.com/metusalem969-ro/exemplu-web">metusalem969-ro/exemplu-web</a><br>
      GitLab:
      <a href="https://gitlab.com/Hercules-metusalem969/exemplu-web">Hercules-metusalem969/exemplu-web</a>
    </p>
  </main>

  <script>
    const body = document.body;
    const countEl = document.getElementById('count');
    const btn = document.getElementById('btn-click');
    const themeBtns = document.querySelectorAll('.themes button');
    let n = 0;

    btn.addEventListener('click', () => {
      n += 1;
      countEl.textContent = String(n);
    });

    themeBtns.forEach((b) => {
      b.addEventListener('click', () => {
        const theme = b.dataset.theme;
        body.className = theme ? 'theme-' + theme : '';
        themeBtns.forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
      });
    });
  </script>
</body>
</html>
